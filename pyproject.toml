[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "release-note-weaver"
version = "0.1.0"
description = "Generate release notes from Conventional Commit subjects without external services."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Open Source Maintainers" }]
keywords = ["release-notes", "changelog", "conventional-commits", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Build Tools",
]

[project.scripts]
release-note-weaver = "release_note_weaver.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
